<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عروض كانفا حسب الطلب</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://script.google.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3fb;--card:#fff;--tx:#2a2744;--mu:#767394;--pr:#6c5ce7;--pr2:#2bb7c9;--b1:#6c5ce7;--b2:#8574f0;--bd:#e8e5f4;--soft:#eeebfb;--ok:#2fa36b;--bad:#d9534f;--sh:0 8px 28px rgba(80,66,160,.08);--r:20px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14132a;--card:#1d1c37;--tx:#e9e6f7;--mu:#a29ec6;--bd:#2e2c50;--soft:#262447;--sh:0 8px 28px rgba(0,0,0,.28);--pr:#9a8ef7}}
:root[data-theme="dark"]{--bg:#14132a;--card:#1d1c37;--tx:#e9e6f7;--mu:#a29ec6;--bd:#2e2c50;--soft:#262447;--sh:0 8px 28px rgba(0,0,0,.28);--pr:#9a8ef7}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;font-size:16px;line-height:1.75;-webkit-tap-highlight-color:transparent;background-image:radial-gradient(800px 380px at 90% -80px,rgba(108,92,231,.11),transparent),radial-gradient(600px 320px at -5% 0,rgba(43,183,201,.09),transparent);background-repeat:no-repeat}
:focus-visible{outline:3px solid var(--pr2);outline-offset:2px}
.w{max-width:820px;width:100%;margin:0 auto;padding:0 18px 28px}
.v{animation:in .4s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 0;background:var(--bg)}
.logo{font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;background:linear-gradient(135deg,var(--b1),var(--pr2));color:#fff;border-radius:12px;width:34px;height:34px;display:grid;place-items:center;font-size:17px;box-shadow:0 4px 12px rgba(108,92,231,.3)}
.ib{background:var(--card);border:1px solid var(--bd);border-radius:14px;width:42px;height:42px;font-size:18px;cursor:pointer;color:var(--tx);box-shadow:var(--sh)}
.lnk{background:none;border:0;color:var(--pr);font:600 15px Tajawal,sans-serif;cursor:pointer;text-decoration:none;padding:8px}
.hero{text-align:center;padding:30px 0 6px;position:relative}
.pill{display:inline-block;background:var(--soft);color:var(--pr);border-radius:99px;padding:5px 16px;font-size:14px;font-weight:600;margin-bottom:16px}
.hero h1{margin:0 0 12px;font-size:clamp(28px,7.2vw,44px);line-height:1.35;font-weight:700}
.hero h1 span{background:linear-gradient(90deg,var(--b1),var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 auto 24px;color:var(--mu);max-width:460px;font-size:17px}
.mock{position:relative;height:160px;margin:30px auto 0;max-width:340px}
.mock b{position:absolute;width:150px;height:98px;border-radius:18px;box-shadow:var(--sh);border:1px solid var(--bd)}
.mock b:nth-child(1){background:linear-gradient(135deg,#b9b0ff,#7c6cf0);right:6px;top:24px;transform:rotate(7deg)}
.mock b:nth-child(2){background:linear-gradient(135deg,#a8ecf3,#2bb7c9);left:6px;top:12px;transform:rotate(-7deg)}
.mock b:nth-child(3){background:var(--card);left:50%;margin-left:-84px;top:40px;width:168px;height:108px;display:grid;place-items:center;font-size:36px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:700 16px Tajawal,sans-serif;color:#fff;background:linear-gradient(135deg,var(--b1),var(--b2));cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 8px 20px rgba(108,92,231,.26);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.98)}
@media(hover:hover){.btn:hover{box-shadow:0 10px 26px rgba(108,92,231,.36)}}
.btn.s{background:var(--card);color:var(--pr);border:1.5px solid color-mix(in srgb,var(--pr) 40%,var(--bd));box-shadow:none}
.btn.sm{display:inline-block;width:auto;padding:10px 18px;font-size:14px;border-radius:14px}
.btn.bad{background:var(--bad)}.btn.ok{background:linear-gradient(135deg,#2fa36b,#3bb87c);box-shadow:0 6px 16px rgba(47,163,107,.25)}
.btn:disabled{opacity:.5;box-shadow:none;cursor:default}
.cta{max-width:280px;margin:0 auto}
.trust{display:flex;justify-content:center;gap:10px 18px;flex-wrap:wrap;margin-top:20px;color:var(--mu);font-size:14px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}
.kp div{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--sh)}
.kp b{display:block;font-size:21px;color:var(--pr);font-weight:700}.kp span{font-size:13px;color:var(--mu)}
h2.t{text-align:center;font-size:24px;margin:56px 0 22px;font-weight:700}
h2.t:after{content:"";display:block;width:44px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--b1),var(--pr2));margin:10px auto 0}
.grid{display:grid;gap:16px}
@media(min-width:620px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:22px;box-shadow:var(--sh);position:relative}
@media(hover:hover){.g2>.card{transition:transform .2s}.g2>.card:hover{transform:translateY(-3px)}}
.card h3{margin:0 0 4px;font-size:20px;font-weight:700}
.price{font-size:34px;font-weight:700;color:var(--pr);margin:6px 0}
.card ul{list-style:none;padding:0;margin:12px 0 18px;color:var(--mu)}.card li{padding:3px 0}
.card li:before{content:"✓";color:var(--ok);font-weight:700;margin-left:8px}
.badge{position:absolute;top:-12px;left:18px;background:linear-gradient(90deg,var(--pr2),var(--b1));color:#fff;border-radius:99px;padding:3px 14px;font-size:13px;font-weight:600}
.step{text-align:center}.step .n{width:52px;height:52px;border-radius:18px;background:var(--soft);display:grid;place-items:center;margin:0 auto 10px;font-size:24px}
.step b{display:block;font-weight:700}.step span{color:var(--mu);font-size:14px}
.trk{display:flex;gap:8px}.trk input{text-transform:uppercase;letter-spacing:3px;text-align:center;font-family:monospace}
details{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 18px;margin-bottom:10px}
summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}summary:after{content:"＋";color:var(--pr);font-size:18px}details[open] summary:after{content:"－"}
details p{margin:10px 0 0;color:var(--mu)}
footer{text-align:center;color:var(--mu);font-size:14px;padding:40px 0 14px}
.back{background:none;border:0;color:var(--mu);font:600 16px Tajawal,sans-serif;cursor:pointer;padding:14px 0}
.ft{margin:0;font-size:27px;font-weight:700}
label.l{display:block;font-weight:600;margin:24px 0 10px}
input,select,textarea{width:100%;padding:14px 16px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:16px Tajawal,sans-serif;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 16%,transparent)}
[aria-invalid=true]{border-color:var(--bad)}
textarea{min-height:130px;resize:vertical}
.fe{color:var(--bad);font-size:13px;min-height:18px;padding-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button,.chips button{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:14px 8px;font:600 15px Tajawal,sans-serif;cursor:pointer;transition:.15s}
.seg small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.seg .on,.chips .on{border-color:var(--pr);background:var(--soft);color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 18%,transparent)}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:520px){.chips{grid-template-columns:repeat(3,1fr)}}
.chips button{padding:12px 6px;font-size:14px;min-height:50px}
.cnt{display:flex;gap:10px}.cnt button{width:54px;border:1.5px solid var(--bd);background:var(--card);color:var(--pr);border-radius:14px;font:700 24px Tajawal,sans-serif;cursor:pointer}.cnt input{text-align:center;font-weight:700}
.note{background:#fff4d6;color:#8a5a00;border-radius:14px;padding:12px 16px;margin-top:14px;font-size:14px}
.stepper{display:flex;justify-content:space-between;margin:8px 0 28px;position:relative}
.stepper:before{content:"";position:absolute;top:18px;right:12%;left:12%;height:3px;border-radius:3px;background:var(--bd)}
.stepper div{flex:1;text-align:center;font-size:13px;color:var(--mu);position:relative}
.stepper i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--card);border:2px solid var(--bd);margin:0 auto 6px;font-style:normal;font-weight:700}
.stepper .d i{background:var(--ok);border-color:var(--ok);color:#fff}.stepper .c i{border-color:var(--pr);color:var(--pr);background:var(--soft)}.stepper .c{color:var(--tx);font-weight:700}
.bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);margin:28px -18px 0;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;box-shadow:0 -8px 24px rgba(80,66,160,.07)}
.bar .tt small{display:block;color:var(--mu);font-size:12px;line-height:1.3}.bar .tt b{font-size:24px;color:var(--pr);font-weight:700}.bar .btn{flex:1}
.code{font:700 30px/1 monospace;letter-spacing:4px;background:var(--soft);color:var(--pr);border-radius:16px;padding:14px;margin:12px 0;direction:ltr;text-align:center}
.sp{width:34px;height:34px;border:4px solid var(--bd);border-top-color:var(--pr);border-radius:50%;margin:10px auto;animation:r 1s linear infinite!important}@keyframes r{to{transform:rotate(360deg)}}
.sk{height:120px;border-radius:20px;margin-bottom:12px;background:linear-gradient(90deg,var(--soft),var(--bd),var(--soft));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;box-shadow:0 10px 28px rgba(0,0,0,.22);animation:in .25s}.toast.bad{background:var(--bad);color:#fff}
.hid{display:none!important}
.tag{display:inline-block;padding:3px 12px;border-radius:99px;background:var(--soft);color:var(--pr);font-size:13px;font-weight:600;margin:2px 0 2px 4px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
"use strict";
const CFG={WA:"https://wa.me/966558011309",BASE:9,INCL:10,PER:1,PAY:"حوّل المبلغ على رقم الحساب / STC Pay الخاص بالمتجر، ثم أرسل صورة الإيصال لتأكيد التسليم."};
const API="https://script.google.com/macros/s/AKfycbxPlYbsQlbxWYzWsBzbIxfRybgtvKl6l2rnE4b6QgEIQ2Agfl032AgN6bAQ9xTowOoE/exec",db=!API.startsWith("PASTE");
const api={async post(b){const r=await fetch(API,{method:"POST",body:JSON.stringify(b)});return r.json()},async status(id){const r=await fetch(API+"?id="+encodeURIComponent(id)+"&t="+Date.now());return r.json()}};
const SUBJ=[["الرياضيات","➗"],["العلوم","🔬"],["اللغة العربية","📖"],["اللغة الإنجليزية","🔤"],["المهارات الرقمية","💻"],["المهارات الحياتية","🌱"],["التفكير الناقد","🧠"],["التربية الفنية","🎨"],["المهارات الاجتماعية","🤝"],["التربية الإسلامية","🕌"],["غير ذلك","✨"]];
const GR=["أول ابتدائي","ثاني ابتدائي","ثالث ابتدائي","رابع ابتدائي","خامس ابتدائي","سادس ابتدائي","أول متوسط","ثاني متوسط","ثالث متوسط","أول ثانوي","ثاني ثانوي","ثالث ثانوي","غير ذلك"];
const STEPS=["استلام الطلب","جاري التصميم","جاهز للدفع","تم التسليم"];
const $=(s,r=document)=>r.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toEn=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const price=(t,p)=>t==="small"?CFG.BASE:CFG.BASE+Math.max(0,(p||0)-CFG.INCL)*CFG.PER;
const stepOf=s=>!s?1:s.paid?4:s.link?3:s.stage==="design"?2:1;
const ls={get(k,d=null){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const orders={get:()=>ls.get("orders",[])||[],add(id,total){const l=this.get(),o=l.find(x=>x.id===id);this.set(l.filter(x=>x.id!==id),{id,total:total||o?.total||0,at:o?.at||Date.now()})},set(l,o){ls.set("orders",[o,...l].slice(0,20))},del(id){ls.set("orders",this.get().filter(x=>x.id!==id))}};
{const m=ls.get("my");if(m&&!orders.get().length)orders.add(m.id,m.total)}
const fresh=()=>({type:"small",pages:11,phone:"",subject:"",grade:"",desc:""});

let view="home",unsubs=[],busy=false,F={...fresh(),...(ls.get("draft")||{})};
const stop=()=>{unsubs.forEach(u=>u());unsubs=[]};
const th=ls.get("theme");if(th)document.documentElement.dataset.theme=th;

function toast(m,k=""){$(".toast")?.remove();const t=document.createElement("div");t.className="toast "+k;t.textContent=m;t.setAttribute("role","status");document.body.append(t);setTimeout(()=>t.remove(),2600)}
function render(html,keep){const y=scrollY;app.innerHTML=`<div class="${keep?"":"v"}">${html}</div>`;scrollTo(0,keep?y:0)}

addEventListener("hashchange",route);
function route(){stop();({home:showHome,form:showForm,status:showStatus}[view]||showHome)()}
function go(v){view=v;if(location.hash){try{history.replaceState(null,"",location.pathname+location.search)}catch{}}route()}

/* ---------- actions (event delegation) ---------- */
const A={
  home:()=>go("home"),
  theme(){const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),n=cur==="dark"?"light":"dark";d.dataset.theme=n;ls.set("theme",n)},
  order(b){F.type=b.dataset.t;ls.set("draft",F);go("form")},
  track(){const c=toEn($("#tc").value).trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(c))return toast("رقم الطلب لازم يكون ٦ خانات","bad");ls.set("my",{id:c,total:0});orders.add(c,0);go("status")},
  mine:()=>go("status"),
  open(b){const o=orders.get().find(x=>x.id===b.dataset.id);ls.set("my",{id:b.dataset.id,total:o?.total||0});go("status")},
  rm(b){orders.del(b.dataset.id);go("home")},
  goto(){$("#mine")?.scrollIntoView({behavior:"smooth"})},
  seg(b){F.type=b.dataset.t;save();b.parentNode.querySelectorAll("button").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-pressed",x===b)});$("#pgw").classList.toggle("hid",F.type!=="big");upd()},
  chip(b){F.subject=b.dataset.s;save();b.parentNode.querySelectorAll("button").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-pressed",x===b)});$("#grw").classList.toggle("hid",F.subject==="غير ذلك");err("sb")},
  pg(b){F.pages=Math.min(200,Math.max(11,(F.pages||11)+ +b.dataset.d));$("#pg").value=F.pages;save();upd();err("pg")},
  submit,
  async copy(b){try{await navigator.clipboard.writeText(b.dataset.v);toast("تم نسخ الرقم")}catch{toast("انسخ الرقم يدوياً","bad")}},
};
app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b,e)});
const onIn=e=>{const t=e.target,m={pg:"pages",ph:"phone",ds:"desc",gr:"grade"}[t.id];
  if(m){F[m]=m==="pages"?parseInt(toEn(t.value))||0:t.value;save();if(m==="pages")upd();err(t.id)}};
app.addEventListener("input",onIn);app.addEventListener("change",onIn);
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="tc")A.track()});
function save(){ls.set("draft",F)}

/* ---------- storefront ---------- */
const chipBtn=(s,i)=>`<button type="button" data-a="chip" data-s="${s}" class="${F.subject===s?"on":""}" aria-pressed="${F.subject===s}">${i} ${s}</button>`;
function showHome(){
  const ol=orders.get();
  render(`<nav><div class="logo"><i>🎨</i>عروض كانفا</div><div style="display:flex;gap:10px;align-items:center">${ol.length?`<button class="lnk" data-a="goto">📦 طلباتي</button>`:""}<a class="lnk" href="${CFG.WA}" target="_blank" rel="noopener">💬 الدعم</a><button class="ib" data-a="theme" aria-label="تبديل الوضع">🌓</button></div></nav>
  <section class="hero"><div class="pill">✨ تصاميم احترافية على كانفا</div><h1>عرضك التقديمي، <span>مصمَّم على كانفا</span> حسب طلبك</h1>
  <p>اكتب موضوع العرض والمادة والصف، ونرجّع لك عرض مرتب وجاهز بأقل سعر.</p>
  <div class="cta"><button class="btn" data-a="order" data-t="small">اطلب عرضك الآن</button></div>
  <div class="trust"><span>⚡ تنفيذ سريع</span><span>💳 تدفع بعد ما تشوف العرض</span><span>✍️ تعديلات مجانية</span></div>
  <div class="mock" aria-hidden="true"><b></b><b></b><b>📊</b></div>
  <div class="kp"><div><b>${CFG.BASE} ر</b><span>تبدأ من</span></div><div><b>١٢</b><span>صف دراسي</span></div><div><b>١٠+</b><span>مادة</span></div></div></section>
  <h2 class="t">الأسعار</h2>
  <div class="grid g2" style="row-gap:22px">
   <div class="card"><h3>عرض تقديمي صغير</h3><div class="price">${CFG.BASE} ريال</div>
    <ul><li>١٠ صفحات أو أقل</li><li>تصميم احترافي على كانفا</li><li>تعديل واحد مجاني</li></ul><button class="btn s" data-a="order" data-t="small">اطلب الصغير</button></div>
   <div class="card"><span class="badge">للمشاريع الكبيرة</span><h3>عرض تقديمي كبير</h3><div class="price">من ${CFG.BASE+1} ريال</div>
    <ul><li>أكثر من ١٠ صفحات</li><li>${CFG.BASE} ريال + ${CFG.PER} ريال لكل صفحة فوق العشر</li><li>حتى ٣ تعديلات مجانية</li></ul><button class="btn" data-a="order" data-t="big">اطلب الكبير</button></div>
  </div>
  <div class="card" style="margin-top:22px;text-align:center;background:var(--soft)"><div style="font-size:34px">💜</div><b style="font-size:18px">ما عجبك العرض؟</b><p style="margin:6px 0 0;color:var(--mu)">لا تشيل هم! إذا ما عجبك العرض، نسوي لك واحد جديد من الصفر على ذوقك — رضاك هو المهم 💜</p></div>
  <h2 class="t">كيف تطلب؟</h2>
  <div class="grid g4"><div class="step"><div class="n">📝</div><b>عبّ الطلب</b><span>المادة والصف والوصف</span></div><div class="step"><div class="n">🎨</div><b>نصمم لك</b><span>نجهز العرض على كانفا</span></div><div class="step"><div class="n">🔗</div><b>يوصلك الرابط</b><span>تشوف العرض في الموقع</span></div><div class="step"><div class="n">✅</div><b>تدفع وتستلم</b><span>تأكيد الدفع ثم التسليم</span></div></div>
  <h2 class="t">تتبّع طلبك</h2>
  <div class="card"><div class="trk"><input id="tc" maxlength="6" dir="ltr" placeholder="XXXXXX" autocapitalize="characters" aria-label="رقم الطلب"><button class="btn sm" data-a="track">تتبّع</button></div></div>
  <h2 class="t">أسئلة شائعة</h2>
  <details><summary>كم تعديل أقدر أطلب؟</summary><p>العرض الصغير له تعديل واحد مجاني، والكبير حتى ٣ تعديلات مجانية. وإذا ما عجبك العرض أصلاً نسوي لك واحد جديد.</p></details>
  <details><summary>متى أدفع؟</summary><p>بعد ما نرسل لك رابط العرض وتشوفه، مو قبل.</p></details>
  <details><summary>أي المواد والصفوف متوفرة؟</summary><p>كل المواد من أول ابتدائي إلى ثالث ثانوي، ولو موضوعك غير ذلك اختر "غير ذلك" واكتب وصفه.</p></details>
  <details><summary>كيف أعرف حالة طلبي؟</summary><p>بعد الطلب يظهر لك رقم طلب، حطه في خانة التتبّع في أي وقت ومن أي جهاز.</p></details>
  ${ol.length?`<h2 class="t" id="mine">📦 طلباتي</h2><p style="text-align:center;color:var(--mu);margin:-8px 0 14px">طلعت من الموقع بالغلط؟ طلباتك محفوظة هنا، افتح طلبك وتابعه أو استلم عرضك.</p>${ol.map(o=>`<div class="card oc" style="margin-bottom:10px" data-id="${esc(o.id)}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><b style="font-family:monospace;font-size:18px;letter-spacing:2px">#${esc(o.id)}</b><div style="color:var(--mu);font-size:13px">${new Date(o.at).toLocaleDateString("ar-SA")}${o.total?" · "+o.total+" ريال":""}</div></div><span class="tag st">…</span></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm oo" data-a="open" data-id="${esc(o.id)}" style="flex:1">فتح الطلب</button><button class="btn s sm" data-a="rm" data-id="${esc(o.id)}">إزالة</button></div></div>`).join("")}`:""}
  <div class="card" style="text-align:center;margin-top:26px"><div style="font-size:34px">🛟</div><b style="font-size:18px">الدعم الفني</b><p style="margin:6px 0 14px;color:var(--mu)">عندك استفسار أو مشكلة؟ تواصل معنا على واتساب.</p><a class="btn" href="${CFG.WA}" target="_blank" rel="noopener">💬 تواصل مع الدعم الفني</a></div>
  <footer>© عروض كانفا حسب الطلب</footer>`);
  if(db)ol.forEach(async o=>{try{const s=await api.status(o.id),n=stepOf(s.found?s:null),c=app.querySelector(`.oc[data-id="${o.id}"]`);if(!c)return;
    c.querySelector(".st").textContent=["","تم استلام الطلب","جاري التصميم","جاهز للدفع 💳","تم التسليم ✅"][n];
    c.querySelector(".oo").textContent=n===4?"📥 استلام العرض":n===3?"👀 شاهد المعاينة":"فتح الطلب"}catch{}});
}

function showForm(){
  const big=F.type==="big",sb=F.subject;
  render(`<button class="back" data-a="home">→ رجوع</button><h2 class="ft">اطلب عرضك</h2>
  ${db?"":`<div class="note" id="dbw">⚠️ الموقع غير مربوط بالخادم بعد (انظر خطوات الإعداد).</div>`}
  <label class="l">نوع العرض</label>
  <div class="seg" role="group"><button type="button" data-a="seg" data-t="small" class="${big?"":"on"}" aria-pressed="${!big}">صغير<small>${CFG.BASE} ريال · حتى ١٠ صفحات · تعديل مجاني</small></button><button type="button" data-a="seg" data-t="big" class="${big?"on":""}" aria-pressed="${big}">كبير<small>+${CFG.PER} ريال لكل صفحة زيادة · ٣ تعديلات مجانية</small></button></div>
  <div id="pgw" class="${big?"":"hid"}"><label class="l" for="pg">عدد الصفحات</label><div class="cnt"><button type="button" data-a="pg" data-d="-1" aria-label="أقل">−</button><input id="pg" inputmode="numeric" value="${F.pages}"><button type="button" data-a="pg" data-d="1" aria-label="أكثر">+</button></div><div class="fe" id="e-pg"></div></div>
  <label class="l" for="ph">رقم الجوال</label><input id="ph" type="tel" inputmode="numeric" placeholder="05xxxxxxxx" maxlength="10" dir="ltr" style="text-align:right" value="${esc(F.phone)}" autocomplete="tel"><div class="fe" id="e-ph"></div>
  <label class="l">المادة الدراسية للعرض</label>
  <div class="chips" id="sb">${SUBJ.map(([s,i])=>chipBtn(s,i)).join("")}</div><div class="fe" id="e-sb"></div>
  <div id="grw" class="${sb&&sb!=="غير ذلك"?"":"hid"}"><label class="l" for="gr">الصف الدراسي</label>
  <select id="gr"><option value="">اختر الصف</option>${GR.map(s=>`<option${F.grade===s?" selected":""}>${s}</option>`).join("")}</select><div class="fe" id="e-gr"></div></div>
  <label class="l" for="ds">وصف العرض — عن ايش يكون؟</label><textarea id="ds" placeholder="مثال: درس الكسور العشرية مع أمثلة وصور وأسئلة تفاعلية في النهاية...">${esc(F.desc)}</textarea><div class="fe" id="e-ds"></div>
  <div class="bar"><div class="tt"><small id="bd"></small><b id="tot"></b></div><button class="btn" id="go" data-a="submit">إتمام الطلب</button></div>`);
  upd();
}
function upd(){const p=Math.max(11,F.pages||0),big=F.type==="big";$("#tot").textContent=price(F.type,p)+" ريال";
  $("#bd").textContent=big?`${CFG.BASE} + ${p-CFG.INCL} صفحة إضافية × ${CFG.PER}`:"عرض صغير · حتى ١٠ صفحات"}
function err(k,m=""){const e=$("#e-"+k);if(e)e.textContent=m;const i=$("#"+k);if(i)i.setAttribute("aria-invalid",!!m)}
function validate(){const e={},big=F.type==="big";
  if(big&&!(F.pages>CFG.INCL))e.pg="عدد الصفحات لازم يكون أكثر من ١٠";
  if(!/^05\d{8}$/.test(toEn(F.phone).trim()))e.ph="اكتب رقم جوال صحيح يبدأ بـ 05 (١٠ أرقام)";
  if(!F.subject)e.sb="اختر المادة الدراسية";
  else if(F.subject!=="غير ذلك"&&!F.grade)e.gr="اختر الصف الدراسي";
  if(F.desc.trim().length<5)e.ds="اكتب وصف العرض (٥ أحرف على الأقل)";return e}
async function submit(){
  if(busy)return;const e=validate(),ks=["pg","ph","sb","gr","ds"];ks.forEach(k=>err(k,e[k]||""));
  const f=ks.find(k=>e[k]);if(f){($("#"+f)||$("#e-"+f)).scrollIntoView({behavior:"smooth",block:"center"});return}
  if(!db)return toast("الطلبات غير متاحة حالياً، حاول بعد قليل","bad");
  busy=true;const b=$("#go");b.disabled=true;b.textContent="جاري الإرسال...";
  try{
    const big=F.type==="big",pages=big?F.pages:10;
    const r=await api.post({a:"create",order:{phone:toEn(F.phone).trim(),type:F.type,pages,subject:F.subject,grade:F.subject==="غير ذلك"?"":F.grade,desc:F.desc.trim()}});
    if(!r||!r.id)throw 0;
    ls.set("my",{id:r.id,total:r.total});orders.add(r.id,r.total);ls.set("draft",null);F=fresh();go("status");
  }catch{toast("تعذّر إرسال الطلب، حاول مرة ثانية","bad");const b2=$("#go");if(b2){b2.disabled=false;b2.textContent="إتمام الطلب"}}
  finally{busy=false}
}

function showStatus(){
  const my=ls.get("my");if(!my){go("home");return}
  const draw=(s,keep)=>{const n=stepOf(s),link=esc(s?.link),fin=esc(s?.final||s?.link);
    const sp=`<div class="stepper">${STEPS.map((t,i)=>{const d=i+1<n||n===4;return `<div class="${d?"d":i+1===n?"c":""}"><i>${d?"✓":i+1}</i>${t}</div>`}).join("")}</div>`;
    const body=n===4?`<div style="font-size:50px">🎉</div><h2>تم الدفع وتسليم العرض</h2><p style="color:var(--mu)">شكراً لك! هذا رابط عرضك:</p><a class="btn" href="${fin}" target="_blank" rel="noopener">فتح العرض</a>`
    :n===3?`<div style="font-size:50px">✅</div><h2>عرضك جاهز!</h2><p style="color:var(--mu)">شاهد معاينة العرض أولاً، ثم ادفع لاستلام نسختك النهائية.</p><p style="color:var(--mu);font-size:14px">ما عجبك؟ نسوي لك عرض جديد 💜</p><a class="btn s" href="${link}" target="_blank" rel="noopener">مشاهدة المعاينة</a><div class="code" style="letter-spacing:0;font-size:24px">${esc(s.price||my.total)} ريال</div><p style="color:var(--mu)">${esc(CFG.PAY)}</p>`
    :`<div style="font-size:50px">${n===2?"🎨":"📬"}</div><h2>${n===2?"جاري تصميم عرضك":"تم استلام طلبك"}</h2><p style="color:var(--mu)">${n===2?"فريقنا يشتغل على عرضك الحين.":"بنبدأ فيه قريباً."} أول ما يجهز يظهر الرابط هنا تلقائياً.</p>`;
    render(`<button class="back" data-a="home">→ الرئيسية</button><div class="card" style="text-align:center">${sp}${body}
    <div style="margin-top:18px;color:var(--mu);font-size:14px">رقم طلبك — احتفظ فيه للمتابعة</div><div class="code">${esc(my.id)}</div><button class="btn s sm" data-a="copy" data-v="${esc(my.id)}">📋 نسخ الرقم</button></div><a class="btn s" style="margin-top:14px" href="${CFG.WA}" target="_blank" rel="noopener">💬 تحتاج مساعدة؟ تواصل مع الدعم الفني</a>`,keep)};
  draw(null);
  let last="",fin=false;const poll=async()=>{try{const s=await api.status(my.id),j=JSON.stringify(s);if(s.paid)fin=true;if(j===last)return;last=j;draw(s.found?s:null,true)}catch{}};
  if(db){poll();const t=setInterval(()=>{if(!document.hidden&&!fin)poll()},10000);unsubs.push(()=>clearInterval(t))}
}

route();
</script>
</body>
</html>
