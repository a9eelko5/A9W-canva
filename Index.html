<body>
<div class="w" id="app"></div>
<script>
"use strict";
const CFG={WA:"https://wa.me/966558011309",BASE:6,INCL:10,PER:1,PAY:"حوّل المبلغ على رقم الحساب / STC Pay الخاص بالمتجر، ثم أرسل صورة الإيصال لتأكيد التسليم."};
const API="https://script.google.com/macros/s/AKfycbwr1d21LJbbOepkUbF13rAzpnSfFM2MDYV0tamhiPmu2uTvf-5W8X08lw5tIfY7d3hWog/exec",db=!API.startsWith("PASTE");
const api={async post(b){const r=await fetch(API,{method:"POST",body:JSON.stringify(b)});return r.json()},async status(id){const r=await fetch(API+"?id="+encodeURIComponent(id)+"&t="+Date.now());return r.json()}};
const SUBJ=[["الرياضيات","➗"],["العلوم","🔬"],["اللغة العربية","📖"],["اللغة الإنجليزية","🔤"],["المهارات الرقمية","💻"],["المهارات الحياتية","🌱"],["التفكير الناقد","🧠"],["التربية الفنية",""],["المهارات الاجتماعية","🤝"],["التربية الإسلامية","🕌"],["غير ذلك",""]];
const GR=["أول ابتدائي","ثاني ابتدائي","ثالث ابتدائي","رابع ابتدائي","خامس ابتدائي","سادس ابتدائي","أول متوسط","ثاني متوسط","ثالث متوسط","أول ثانوي","ثاني ثانوي","ثالث ثانوي","غير ذلك"];
const STEPS=["استلام الطلب","جاري التصميم","جاهز للدفع","تم التسليم"];
const $=(s,r=document)=>r.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toEn=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const price=(t,p)=>t==="small"?CFG.BASE:CFG.BASE+Math.max(0,(p||0)-CFG.INCL)*CFG.PER;
const stepOf=s=>!s?1:s.paid?4:s.link?3:s.stage==="design"?2:1;
const ls={get(k,d=null){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const orders={get:()=>ls.get("orders",[])||[],add(id,total){const l=this.get(),o=l.find(x=>x.id===id);this.set(l.filter(x=>x.id!==id),{id,total:total||o?.total||0,at:o?.at||Date.now()})},set(l,o){ls.set("orders",[o,...l].slice(0,20))},del(id){ls.set("orders",this.get().filter(x=>x.id!==id))}};
{const m=ls.get("my");if(m&&!orders.get().length)orders.add(m.id,m.total)}
const fresh=()=>({type:"small",pages:11,phone:"",subject:"",grade:"",desc:""});

let view="home",unsubs=[],busy=false,F={...fresh(),...(ls.get("draft")||{})};
const stop=()=>{unsubs.forEach(u=>u());unsubs=[]};
const th=ls.get("theme");if(th)document.documentElement.dataset.theme=th;

function toast(m,k=""){$(".toast")?.remove();const t=document.createElement("div");t.className="toast "+k;t.textContent=m;t.setAttribute("role","status");document.body.append(t);setTimeout(()=>t.remove(),2600)}
function render(html,keep){const y=scrollY;app.innerHTML=`<div class="${keep?"":"v"}">${html}</div>`;scrollTo(0,keep?y:0)}

addEventListener("hashchange",route);
function route(){stop();({home:showHome,form:showForm,status:showStatus,auth:showAuth,account:showAccount}[view]||showHome)()}
function go(v){view=v;if(location.hash){try{history.replaceState(null,"",location.pathname+location.search)}catch{}}route()}

/* ---------- actions (event delegation) ---------- */
const A={
  home:()=>go("home"),
  theme(){const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),n=cur==="dark"?"light":"dark";d.dataset.theme=n;ls.set("theme",n)},
  async order(b){F.type=b.dataset.t;ls.set("draft",F);await ready;if(!user){after="form";authTab="login";return go("auth")}go("form")},
  track(){const c=toEn($("#tc").value).trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(c))return toast("رقم الطلب لازم يكون ٦ خانات","bad");ls.set("my",{id:c,total:0});orders.add(c,0);go("status")},
  mine:()=>go("status"),
  open(b){ls.set("my",{id:b.dataset.id,total:Number(b.dataset.total)||0});go("status")},
  goto(){$("#mine")?.scrollIntoView({behavior:"smooth"})},
  seg(b){F.type=b.dataset.t;save();b.parentNode.querySelectorAll("button").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-pressed",x===b)});$("#pgw").classList.toggle("hid",F.type!=="big");upd()},
  chip(b){F.subject=b.dataset.s;save();b.parentNode.querySelectorAll("button").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-pressed",x===b)});$("#grw").classList.toggle("hid",F.subject==="غير ذلك");err("sb")},
  pg(b){F.pages=Math.min(200,Math.max(11,(F.pages||11)+ +b.dataset.d));$("#pg").value=F.pages;save();upd();err("pg")},
  submit,
  acct(){if(user)go("account");else{authTab="login";after=null;go("auth")}},
  authgo(b){const e=$("#au-email");if(e)authEmail=e.value.trim().toLowerCase();authTab=b.dataset.m;showAuth()},
  async logout(){try{await api.post({a:"logout",token:tok.get()})}catch{}tok.set("");user=null;toast("تم تسجيل الخروج");go("home")},
  async doLogin(b){const email=gv("au-email").toLowerCase(),pw=($("#au-pw")||{}).value||"";authEmail=email;aerr();
    if(!EMAIL_RE.test(email)||!pw)return aerr("اكتب الإيميل وكلمة السر");
    const r=await authCall(b,{a:"login",email,password:pw});if(!r)return;
    if(r.token)return done(r);
    if(r.error==="unverified"){authTab="verify";toast("فعّل حسابك: أرسلنا لك رمز جديد ");return showAuth()}
    aerr(AMSG[r.error]||"تعذّر تسجيل الدخول")},
  async doSignup(b){const name=gv("au-name"),email=gv("au-email").toLowerCase(),phone=toEn(gv("au-phone")),pw=$("#au-pw").value,pw2=$("#au-pw2").value;authEmail=email;aerr();
    if(name.length<2)return aerr("اكتب اسمك");
    if(!EMAIL_RE.test(email))return aerr("اكتب إيميل صحيح");
    if(!/^05\d{8}$/.test(phone))return aerr("اكتب رقم جوال صحيح يبدأ بـ 05 (١٠ أرقام)");
    if(pw.length<8)return aerr("كلمة السر ٨ أحرف على الأقل");
    if(pw!==pw2)return aerr("كلمتا السر غير متطابقتين");
    const r=await authCall(b,{a:"signup",name,email,phone,password:pw});if(!r)return;
    if(r.verify){authTab="verify";toast("أرسلنا رمز التحقق إلى إيميلك ");return showAuth()}
    aerr(AMSG[r.error]||"تعذّر إنشاء الحساب")},
  async doVerify(b){const code=toEn(gv("au-code"));aerr();
    if(!/^\d{6}$/.test(code))return aerr("اكتب الرمز المكوّن من ٦ أرقام");
    const r=await authCall(b,{a:"verify",email:authEmail,code});if(!r)return;
    if(r.token)return done(r);
    aerr(AMSG[r.error]||"تعذّر التحقق")},
  async doResend(b){const r=await authCall(b,{a:"resend",email:authEmail});if(!r)return;
    if(r.error)return aerr(AMSG[r.error]||"تعذّر الإرسال");toast("أرسلنا لك رمز جديد ")},
  async doForgot(b){const email=gv("au-email").toLowerCase();authEmail=email;aerr();
    if(!EMAIL_RE.test(email))return aerr("اكتب إيميلك المسجّل");
    const r=await authCall(b,{a:"forgot",email});if(!r)return;
    authTab="reset";toast("إذا الإيميل مسجّل أرسلنا لك رمز الاستعادة ");showAuth()},
  async doReset(b){const code=toEn(gv("au-code")),pw=$("#au-pw").value,pw2=$("#au-pw2").value;aerr();
    if(!/^\d{6}$/.test(code))return aerr("اكتب الرمز المكوّن من ٦ أرقام");
    if(pw.length<8)return aerr("كلمة السر الجديدة ٨ أحرف على الأقل");
    if(pw!==pw2)return aerr("كلمتا السر غير متطابقتين");

  $("#bd").textContent=big?`${CFG.BASE} + ${p-CFG.INCL} صفحة إضافية × ${CFG.PER}`:"عرض صغير · حتى ١٠ صفحات"}

function showStatus(){

  const draw=(s,keep)=>{const n=stepOf(s),link=esc(s?.link),fin=esc(s?.final||s?.link);

    :`<div class="ic w">${n===2?"٢":"١"}</div><h2>${n===2?"جاري تصميم عرضك":"تم استلام طلبك"}</h2><p style="color:var(--mu)">${n===2?"فريقنا يشتغل على عرضك الحين.":"بنبدأ فيه قريباً."} أول ما يجهز يظهر الرابط هنا تلقائياً.</p>`;
    render(`<button class="back" data-a="home">→ الرئيسية</button><div class="card" style="text-align:center">${sp}${body}
    <div style="margin-top:18px;color:var(--mu);font-size:14px">رقم طلبك — احتفظ فيه للمتابعة</div><div class="code">${esc(my.id)}</div><button class="btn s sm" data-a="copy" data-v="${esc(my.id)}">📋 نسخ الرقم</button></div><a class="btn s" style="margin-top:14px" href="${CFG.WA}" target="_blank" rel="noopener">تحتاج مساعدة؟ تواصل مع الدعم الفني</a>`,keep)};
  draw(null);

   verify:["تفعيل الحساب",`<p style="color:var(--mu);margin:0">أرسلنا رمز تحقق من ٦ أرقام إلى <b dir="ltr">${em}</b>. افتح إيميلك (وشوف مجلد Spam لو ما لقيته).</p><label class="l" for="au-code">رمز التحقق</label><input id="au-code" class="otp" inputmode="numeric" maxlength="6" dir="ltr" autocomplete="one-time-code" placeholder="••••••">`,"doVerify","تفعيل",`<button class="lnk" data-a="doResend">إعادة إرسال الرمز</button><button class="lnk" data-a="authgo" data-m="signup">تغيير الإيميل</button>`],

   reset:["كلمة سر جديدة",`<p style="color:var(--mu);margin:0">أدخل الرمز اللي وصل إلى <b dir="ltr">${em}</b> وكلمة السر الجديدة.</p><label class="l" for="au-code">رمز الاستعادة</label><input id="au-code" class="otp" inputmode="numeric" maxlength="6" dir="ltr" autocomplete="one-time-code" placeholder="••••••">`+PW("au-pw","كلمة السر الجديدة","new-password")+PW("au-pw2","تأكيد كلمة السر","new-password"),"doReset","تغيير كلمة السر",`<button class="lnk" data-a="authgo" data-m="forgot">إعادة إرسال الرمز</button>`]
